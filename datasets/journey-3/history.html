<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Journey-3 · Knowledge Base Tasks</title>
<style>
  body { font: 16px system-ui; margin: 40px auto; padding: 0 24px; max-width: 1100px; color: #172744; background: #f6f8fc; }
  h1 { font-size: 30px; }
  h2, h3, h4 { margin: 0 0 8px; }
  h3 { font-size: 16px; }
  #environments:not([hidden]) { display: flex; gap: 8px; }
  #environments a { color: inherit; background: white; border: 1px solid #ccd3df; border-radius: 6px; padding: 6px 12px; }
  #environments a[aria-current="page"] { color: white; background: #203558; border-color: #203558; text-decoration: none; }
  select { max-width: min(800px, 85vw); font: inherit; padding: 9px; margin: 0 16px 12px 5px; border: 1px solid #ccd3df; border-radius: 6px; }
  section { background: white; border: 1px solid #dde2ec; border-radius: 12px; padding: 24px; margin: 20px 0; }
  .trends { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  #rates[hidden] { display: none; }
  .trends section { margin: 0; padding: 14px; min-width: 0; }
  #metrics { margin-top: 14px; }
  .overview .metric-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .metric-pair h4 { font-size: 15px; }
  #metrics:not(.overview) .case-plot h4 { display: none; }
  .metric-caption { margin: 8px 0 14px; font-size: 14px; }
  .plot-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; }
  .plot-legend button { padding: 2px 4px; font-size: inherit; }
  @media (max-width: 840px) { .overview .metric-pair { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 640px) { .trends { grid-template-columns: minmax(0, 1fr); } body { padding: 0 12px; } }
  svg { width: 100%; height: auto; display: block; }
  p { color: #51617c; }
  #legend:not([hidden]) { display: flex; flex-wrap: wrap; gap: 6px; max-height: 6rem; overflow: auto; margin: 12px 0; }
  #legend button { color: inherit; background: white; border: 1px solid #dde2ec; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .chart-series polyline { fill: none; stroke: currentColor; stroke-width: 2; }
  .chart-series circle { fill: currentColor; }
  .chart-series.muted, svg:has(.chart-series:hover) .chart-series:not(:hover) { opacity: .2; }
  .threshold-plot .chart-series.muted { pointer-events: none; }
  .axis { stroke: #d7dfeb; }
  svg text { fill: #51617c; font: 12px system-ui; }
  .view-buttons:not([hidden]) { display: flex; flex-wrap: wrap; gap: 6px; }
  .view-buttons button, .plot-legend button { border: 1px solid #ccd3df; border-radius: 6px; background: white; color: inherit; cursor: pointer; font-family: inherit; }
  .view-buttons button { padding: 6px 10px; font-size: inherit; }
  .view-buttons button[aria-pressed="true"], .plot-legend button[aria-pressed="true"] { background: #203558; color: white; }
  .record { padding: 12px 0; border-top: 1px solid #e4e8f1; }
  .record dl { margin: 0; }
  .record dl div { display: grid; grid-template-columns: minmax(5.8rem, auto) minmax(0, 1fr); gap: .5em; margin-top: .25em; }
  .record dt { color: #51617c; }
  .record dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .record ul { margin: 0; padding-left: 1.25em; }
  #run-overview dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 12px; margin-bottom: 0; }
  #run-overview dt { color: #51617c; }
  #run-overview dd { margin: 4px 0 0; font-size: 20px; font-variant-numeric: tabular-nums; }
  #report-coverage { overflow-wrap: anywhere; }
  #details summary { padding: 10px 0; border-top: 1px solid #e4e8f1; cursor: pointer; }
  #details details .record { margin-left: .8em; }
  .detail-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .detail-table th, .detail-table td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #e4e8f1; }
  .detail-table th { color: #51617c; }
</style>
</head>
<body>
<nav id="environments" aria-label="测试环境" hidden>
  <a href="../qa/">QA</a><a href="../production/">Production</a>
</nav>
<h1>Journey-3 · Knowledge Base Tasks</h1>
<p id="description">历史指标来自 QA。带会话和错误详情的完整报告可在 QA 工作区的 Catalog 中下载。</p>
<main id="dashboard">
<p id="report-coverage" hidden></p>
<label>Case <select id="case"></select></label>
<label id="revision-label">固定版本 <select id="revision"></select></label>
<p id="coverage" aria-live="polite"></p>
<div id="legend" aria-label="按颜色识别 Case，点击查看单题" hidden></div>
<div class="trends" id="rates">
  <section><h3>问答正常完成率</h3><svg id="completion_rate" viewBox="0 0 480 170" role="img" aria-label="问答正常完成率"></svg></section>
  <section><h3>问答超时率</h3><svg id="timeout_rate" viewBox="0 0 480 170" role="img" aria-label="问答超时率"></svg></section>
</div>
<div id="metrics"></div>
<section id="run-overview" hidden>
  <h2 id="run-overview-title">最近一次运行概况</h2>
  <dl id="run-overview-stats" aria-live="polite"></dl>
</section>
<section id="details" hidden>
  <h2 id="details-title">最近一次运行明细</h2>
  <div class="view-buttons" role="group" aria-label="运行明细">
    <button type="button" data-detail="errors" aria-pressed="true">报错未正常完成</button>
    <button type="button" data-detail="timeouts" aria-pressed="false">超时未正常完成</button>
    <button type="button" data-detail="tools" aria-pressed="false">失败工具调用</button>
    <button type="button" data-detail="scores" aria-pressed="false">低于 50 分</button>
  </div>
  <p id="detail-count" aria-live="polite"></p>
  <p id="public-detail-caption" hidden>公开明细使用逐题指标。原始报错、调用参数、失分理由及会话定位信息保存在对应工作区的完整报告。</p>
  <div id="detail-records"></div>
</section>
</main>
<script>
const data = /*HISTORY_DATA*/[];
const jobs = /*HISTORY_JOBS*/{};
const currentRun = /*RUN_DETAILS*/null;
const runMetadata = /*RUN_METADATA*/{};
const pagesEnvironment = /*PAGES_ENVIRONMENT*/null;
const publicRunDetails = Boolean(pagesEnvironment && currentRun?.metrics_only);
const scope = document.getElementById('case');
const revision = document.getElementById('revision');
const legend = document.getElementById('legend');
const planned = Object.values(jobs).flat();
const cases = [...new Set([...planned, ...data.map(row => row.case_id)])]
  .sort((a, b) => Number(a.slice(3)) - Number(b.slice(3)));
const runKey = row => row.run_id + '/' + row.run_attempt;
const runs = new Map();
for (const row of data) {
  const key = runKey(row);
  if (!runs.has(key)) runs.set(key, {key, run_id: row.run_id, run_attempt: row.run_attempt,
    date: row.evaluated_at, cases: new Set()});
  const run = runs.get(key);
  run.cases.add(row.case_id);
  if (row.evaluated_at < run.date) run.date = row.evaluated_at;
}
const timeline = [...runs.values()].sort((a, b) => {
  if (a.run_id === b.run_id) return a.run_attempt - b.run_attempt;
  const aNumber = runMetadata[a.run_id]?.number;
  const bNumber = runMetadata[b.run_id]?.number;
  if (aNumber && bNumber && aNumber !== bNumber) return aNumber - bNumber;
  return BigInt(a.run_id) < BigInt(b.run_id) ? -1 : 1;
});
const runIndex = new Map(timeline.map(({key}, index) => [key, index]));
const tickIndexes = timeline.length <= 6 ? timeline.map((_, index) => index) :
  Array.from({length: 6}, (_, index) => Math.round(index * (timeline.length - 1) / 5));
const formatRunTime = new Intl.DateTimeFormat('zh-CN', {
  timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
});
const runTooltips = timeline.map(runTooltip);

function runLabel(id, attempt) {
  const number = runMetadata[id]?.number;
  const label = number ? '#' + number : 'ID ' + (id.length > 6 ? '…' + id.slice(-6) : id);
  return attempt > 1 ? label + '.' + attempt : label;
}

function runTooltip(run) {
  const meta = runMetadata[run.run_id];
  const started = run.run_attempt === meta?.attempt ? meta.started_at : null;
  const created = run.run_attempt === 1 ? meta?.created_at : null;
  const time = started || created || run.date;
  const label = started ? 'GitHub 开始时间' : created ? 'GitHub 触发时间' : 'QA 首条记录时间';
  return runLabel(run.run_id, run.run_attempt) + ' · ' + label + ' ' +
    formatRunTime.format(new Date(time)) + '（北京时间）';
}

function addOption(parent, value, label = value) {
  const option = document.createElement('option');
  option.value = value;
  option.textContent = label;
  parent.append(option);
}

addOption(scope, 'all', '全部');
const jobLabels = {
  documents: 'Job-1-文档知识库问答',
  operations: 'Job-2-运营知识库问答',
};
for (const name of Object.keys(jobs)) {
  addOption(scope, 'job:' + name, jobLabels[name] ?? 'Job · ' + name);
}
for (const id of cases) addOption(scope, id);

function version(row) {
  return [row.case_revision, row.snapshot_id, row.evaluator_version, row.model_key].map(value => value ?? '—').join(' / ');
}

function caseColor(id) {
  const hue = cases.indexOf(id) * 137.508 % 360;
  return 'hsl(' + hue + ' 68% 39%)';
}

function jobOrAll() {
  return scope.value === 'all' || scope.value.startsWith('job:');
}

function rowsForScope() {
  if (scope.value === 'all') return data;
  if (scope.value.startsWith('job:')) {
    const jobCases = new Set(jobs[scope.value.slice(4)]);
    return data.filter(row => jobCases.has(row.case_id));
  }
  return data.filter(row => row.case_id === scope.value);
}

function visibleRows() {
  const rows = rowsForScope();
  return jobOrAll() ? rows : rows.filter(row => version(row) === revision.value);
}

function latestRunRows(rows) {
  return rows.filter(row => row.run_id === currentRun.run_id && row.run_attempt === currentRun.attempt);
}

function selectScope() {
  document.getElementById('revision-label').hidden = jobOrAll();
  revision.replaceChildren();
  if (!jobOrAll()) {
    for (const label of new Set(rowsForScope().map(version))) addOption(revision, label);
  }
  render();
}

function svgNode(parent, name, attributes, label) {
  const element = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
  if (label !== undefined) element.textContent = label;
  parent.append(element);
  return element;
}

function chartAxes(id, maximum, percent) {
  const svg = document.getElementById(id);
  svg.replaceChildren();
  const left = 43, right = 454, top = 12, bottom = 137;
  const pointX = index => timeline.length <= 1 ? (left + right) / 2 :
    left + (right - left) * index / (timeline.length - 1);
  const pointY = value => bottom - (bottom - top) * value / maximum;
  for (let i = 0; i <= 4; i++) {
    const value = maximum * i / 4;
    const y = pointY(value);
    svgNode(svg, 'line', {x1: left, x2: right, y1: y, y2: y, class: 'axis'});
    svgNode(svg, 'text', {x: left - 5, y: y + 4, 'text-anchor': 'end'},
      Number(value.toFixed(1)) + (percent ? '%' : ''));
  }
  for (const index of tickIndexes) {
    const run = timeline[index];
    const anchor = timeline.length === 1 ? 'middle' :
      index === 0 ? 'start' : index === timeline.length - 1 ? 'end' : 'middle';
    const tick = svgNode(svg, 'text', {x: pointX(index), y: 163, 'text-anchor': anchor, 'data-run-tick': run.key},
      runLabel(run.run_id, run.run_attempt));
    svgNode(tick, 'title', {}, runTooltips[index]);
  }
  return {svg, pointX, pointY};
}

function draw(id, series, metric, chartDomain, color, {byCase = false, percent = false, describe} = {}) {
  const values = [...series.values()].flat().map(metric);
  const maximum = chartDomain ?? values.reduce((max, value) => Math.max(max, value ?? 0), 1);
  const {svg, pointX, pointY} = chartAxes(id, maximum, percent);
  if (!values.some(Number.isFinite)) svgNode(svg, 'text', {x: 250, y: 80, 'text-anchor': 'middle'}, '暂无数据');
  for (const [key, entries] of series) {
    const first = entries[0];
    const group = svgNode(svg, 'g', {class: 'chart-series', 'data-case': first.case_id ?? '', 'data-series': key,
      color: byCase ? caseColor(first.case_id) : typeof color === 'function' ? color(key) : color});
    let points = [];
    function finishSegment() {
      if (points.length > 1) svgNode(group, 'polyline', {points: points.join(' ')});
      points = [];
    }
    let previous;
    for (const row of [...entries].sort((a, b) => runIndex.get(runKey(a)) - runIndex.get(runKey(b)))) {
      const value = metric(row);
      const index = runIndex.get(runKey(row));
      if (!Number.isFinite(value)) {
        finishSegment();
        continue;
      }
      if (previous !== index - 1) finishSegment();
      previous = index;
      const x = pointX(index);
      const y = pointY(value);
      points.push(x + ',' + y);
      const point = svgNode(group, 'circle', {cx: x, cy: y, r: byCase ? 2.5 : 4});
      const label = runTooltips[index] + ' · ' + Number(value.toFixed(2));
      const tooltip = describe ? runTooltips[index] + ' · ' + describe(row) :
        row.case_id ? row.case_id + ' · ' + label + '\n' + version(row) : label;
      svgNode(point, 'title', {}, tooltip);
    }
    finishSegment();
  }
}

const completedValue = field => row => row.qa_outcome === 'completed' ? row[field] : null;
function toolFailureRate(row) {
  const calls = row.tool_failed + row.tool_succeeded;
  return row.tool_failed !== null && row.tool_succeeded !== null && calls > 0 ? 100 * row.tool_failed / calls : null;
}
const metrics = [
  {id: 'completed_seconds', name: '正常完成任务耗时', unit: '秒',
    limits: Array.from({length: 10}, (_, index) => (index + 1) * 60), value: completedValue('completed_seconds')},
  {id: 'completed_model_rounds', name: '正常完成模型轮次', unit: '轮',
    limits: [10, 20, 30, 40], value: completedValue('completed_model_rounds')},
  {id: 'tool_failure_rate', name: '工具失败率', unit: '%', maximum: 100, color: '#a96812', allCases: true,
    limits: [10, 20, 30, 40], value: toolFailureRate},
  {id: 'quality_score', name: '正常完成得分', unit: '分', maximum: 100, color: '#159f83',
    limits: [20, 40, 60, 80], value: completedValue('quality_score')},
];
const thresholdColors = ['#2469ae', '#088aaf', '#106b66', '#37823b', '#727621', '#9a7210',
  '#a44b14', '#a1336b', '#824ba4', '#494ead'];
const metricHost = document.getElementById('metrics');
const metricViews = metrics.map(createMetricView);

function createMetricView(metric) {
  const section = element('section');
  const pair = element('div');
  pair.className = 'metric-pair';
  const caption = element('p', metric.allCases ?
    '分母为当次所有已记录的 Case。悬浮查看可计算工具失败率的题数。' :
    '分母为当次正常完成且有此指标记录的 Case。');
  caption.className = 'metric-caption';
  section.append(element('h3', metric.name + ' · ' + metric.unit), caption, pair);
  metricHost.append(section);

  const thresholdPane = element('div');
  thresholdPane.className = 'threshold-plot';
  thresholdPane.append(element('h4', '阈值占比趋势'));
  const chart = svgNode(thresholdPane, 'svg', {id: metric.id + '-thresholds', viewBox: '0 0 480 170',
    role: 'img', 'aria-label': metric.name + '阈值占比历史趋势'});
  const controls = element('div');
  controls.className = 'plot-legend';
  controls.setAttribute('role', 'group');
  controls.setAttribute('aria-label', metric.name + '阈值');
  thresholdPane.append(controls);

  const casePane = element('div');
  casePane.className = 'case-plot';
  casePane.append(element('h4', '逐题趋势'));
  svgNode(casePane, 'svg', {id: metric.id, viewBox: '0 0 480 170', role: 'img', 'aria-label': metric.name});
  pair.append(thresholdPane, casePane);

  const suffix = metric.unit === '%' ? '%' : ' ' + metric.unit;
  const thresholds = metric.limits.map((limit, index) => ({
    label: '≤' + limit + suffix, matches: value => value <= limit, color: thresholdColors[index],
  }));
  const last = metric.limits.at(-1);
  thresholds.push({label: '≥' + last + suffix, matches: value => value >= last, color: '#ba322b'});

  const colorByLabel = new Map(thresholds.map(({label, color}) => [label, color]));
  const view = {metric, thresholdPane, chart, caption, thresholds, colorByLabel, active: null};
  const buttons = thresholds.map(({label, color}) => {
    const button = element('button');
    button.type = 'button';
    button.setAttribute('aria-pressed', 'false');
    const swatch = element('span');
    swatch.className = 'swatch';
    swatch.style.backgroundColor = color;
    button.append(swatch, label);
    button.onclick = () => {
      view.active = view.active === label ? null : label;
      for (const control of buttons) control.setAttribute('aria-pressed', String(control.textContent === view.active));
      highlightThreshold(view);
    };
    controls.append(button);
    return button;
  });
  return view;
}

function highlightThreshold({chart, active}) {
  for (const group of chart.querySelectorAll('.chart-series')) {
    group.classList.toggle('muted', active !== null && group.dataset.series !== active);
  }
}

function drawThresholds(view, rows) {
  const {metric, chart, thresholds, colorByLabel} = view;
  const cohorts = new Map();
  for (const row of rows) {
    const key = runKey(row);
    if (!cohorts.has(key)) cohorts.set(key, []);
    cohorts.get(key).push(metric.value(row));
  }

  const curves = new Map();
  for (const [key, values] of cohorts) {
    const measured = values.filter(Number.isFinite);
    if (!measured.length) continue;
    const {run_id, run_attempt} = runs.get(key);
    const total = metric.allCases ? values.length : measured.length;
    for (const {label, matches} of thresholds) {
      if (!curves.has(label)) curves.set(label, []);
      curves.get(label).push({run_id, run_attempt, label, total, measured: measured.length,
        count: measured.filter(matches).length});
    }
  }

  draw(chart.id, curves, row => 100 * row.count / row.total, 100, label => colorByLabel.get(label), {
    percent: true,
    describe: ({label, count, total, measured}) =>
      label + ' · ' + count + ' / ' + total + ' 题（' + (100 * count / total).toFixed(1) + '%）' +
      (measured < total ? ' · 可计算 ' + measured + ' 题' : ''),
  });
  highlightThreshold(view);
}

function showLegend(ids, overview) {
  legend.replaceChildren();
  legend.hidden = !overview || !ids.size;
  if (legend.hidden) return;
  for (const id of cases.filter(id => ids.has(id))) {
    const button = document.createElement('button');
    button.type = 'button';
    button.title = '查看单题 ' + id;
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.backgroundColor = caseColor(id);
    button.append(swatch, id);
    const highlight = active => {
      for (const group of document.querySelectorAll('.chart-series[data-case]:not([data-case=""])')) {
        group.classList.toggle('muted', active && group.dataset.case !== id);
      }
    };
    button.onmouseenter = button.onfocus = () => highlight(true);
    button.onmouseleave = button.onblur = () => highlight(false);
    button.onclick = () => {
      scope.value = id;
      selectScope();
      scope.focus();
    };
    legend.append(button);
  }
}

function drawRates(rows) {
  const counts = new Map();
  for (const row of rows) {
    const key = runKey(row);
    if (row.qa_outcome === 'excluded' || !planned.every(id => runs.get(key).cases.has(id))) continue;
    if (!counts.has(key)) counts.set(key, {
      run_id: row.run_id, run_attempt: row.run_attempt, total: 0, completed: 0, timeout: 0,
    });
    const entry = counts.get(key);
    entry.total++;
    if (row.qa_outcome === 'completed') entry.completed++;
    if (row.qa_outcome === 'timeout') entry.timeout++;
  }
  const series = new Map([['suite', [...counts.values()]]].filter(([, entries]) => entries.length));
  draw('completion_rate', series, row => 100 * row.completed / row.total, 100, '#356df3');
  draw('timeout_rate', series, row => 100 * row.timeout / row.total, 100, '#a96812');
}

function element(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}

function record(title, session, trace, fields, heading = 'h3') {
  const item = element('article');
  item.className = 'record';
  item.append(element(heading, title));
  const values = element('dl');
  for (const [label, value] of [['Session ID', session], ['Trace ID', trace], ...fields]) {
    const field = element('div');
    const detail = element('dd');
    if (Array.isArray(value)) {
      const list = element('ul');
      for (const reason of value) list.append(element('li', reason));
      detail.append(list);
    } else {
      detail.textContent = value ?? '未记录';
    }
    field.append(element('dt', label), detail);
    values.append(field);
  }
  item.append(values);
  return item;
}

let detailTab = 'errors';
const detailTabs = [...document.querySelectorAll('[data-detail]')];
const detailCount = document.getElementById('detail-count');
for (const button of detailTabs) button.onclick = () => {
  detailTab = button.dataset.detail;
  showDetails(visibleRows());
};

const numberForDetail = new Intl.NumberFormat('zh-CN', {maximumFractionDigits: 2});
const publicDetails = {
  errors: {headers: [], matches: row => row.qa_outcome === 'error', cells: () => []},
  timeouts: {headers: ['耗时'], matches: row => row.qa_outcome === 'timeout', cells: row => [
    Number.isFinite(row.duration_seconds) ? numberForDetail.format(row.duration_seconds) + ' 秒' : '未记录',
  ]},
  tools: {headers: ['失败调用', '工具失败率'], matches: row => row.tool_failed > 0, cells: row => {
    const rate = toolFailureRate(row);
    return [row.tool_failed + ' 次', rate === null ? '未记录' : numberForDetail.format(rate) + '%'];
  }},
  scores: {headers: ['得分'], matches: row => row.qa_outcome === 'completed' &&
    Number.isFinite(row.quality_score) && row.quality_score < 50, cells: row => [numberForDetail.format(row.quality_score) + ' 分']},
};

function showPublicDetails(host, rows) {
  const {headers, matches, cells} = publicDetails[detailTab];
  const records = rows.filter(matches).sort((a, b) => cases.indexOf(a.case_id) - cases.indexOf(b.case_id));
  detailCount.textContent = records.length + ' 个 case';
  if (!records.length) {
    host.append(element('p', '当前范围无符合条件的记录。'));
    return;
  }
  const table = element('table');
  table.className = 'detail-table';
  const header = table.createTHead().insertRow();
  for (const label of ['Case', ...headers]) {
    const cell = element('th', label);
    cell.scope = 'col';
    header.append(cell);
  }
  const body = table.createTBody();
  for (const row of records) {
    const tr = body.insertRow();
    for (const value of [row.case_id, ...cells(row)]) tr.append(element('td', value));
  }
  host.append(table);
}

function showDetails(scopeRows) {
  if (!currentRun || (currentRun.metrics_only && !publicRunDetails)) return;
  const latest = latestRunRows(scopeRows);
  const host = document.getElementById('detail-records');
  host.replaceChildren();
  for (const button of detailTabs) button.setAttribute('aria-pressed', String(button.dataset.detail === detailTab));
  if (publicRunDetails) {
    showPublicDetails(host, latest);
    return;
  }
  const include = new Set(latest.filter(row => detailTab !== 'errors' || row.qa_outcome === 'error').map(row => row.case_id));
  const rows = currentRun[detailTab].filter(row => include.has(row[0]));
  rows.sort((a, b) => cases.indexOf(a[0]) - cases.indexOf(b[0]));
  const count = detailTab === 'tools' ? rows.length + ' 次失败调用' :
    new Set(rows.map(row => row[0])).size + ' 个 case';
  detailCount.textContent = count;
  if (!rows.length) host.append(element('p', '当前范围无符合条件的记录。'));
  if (detailTab === 'tools') {
    const groups = new Map();
    for (const row of rows) {
      if (!groups.has(row[0])) groups.set(row[0], []);
      groups.get(row[0]).push(row);
    }
    for (const [id, calls] of groups) {
      const list = element('details');
      list.append(element('summary', id + ' · ' + calls.length + ' 次失败'));
      const expand = () => {
        if (!list.open || list.childElementCount > 1) return;
        for (const [id, session, trace, tool, command, error] of calls) {
          list.append(record(id + ' · ' + tool, session, trace, [
            ['命令 / 参数', command || '未记录'], ['失败信息', error || '未记录'],
          ], 'h4'));
        }
      };
      list.addEventListener('toggle', expand);
      list.open = !jobOrAll();
      expand();
      host.append(list);
    }
    return;
  }
  for (const [id, session, trace, value, reasons] of rows) {
    if (detailTab === 'errors') host.append(record(id, session, trace, [['报错信息', value]]));
    if (detailTab === 'timeouts') host.append(record(id, session, trace,
      [['耗时', value === null ? null : value + ' 秒']]));
    if (detailTab === 'scores') host.append(record(id + ' · ' + value + ' 分', session, trace, [['失分原因', reasons]]));
  }
}

function showRunOverview(rows) {
  if (!currentRun || publicRunDetails) return;
  const selected = latestRunRows(rows);
  const count = outcome => selected.filter(row => row.qa_outcome === outcome).length;
  const completed = count('completed');
  const eligible = selected.length - count('excluded');
  const scored = selected.filter(row => row.qa_outcome === 'completed' && Number.isFinite(row.quality_score));
  const tools = selected.filter(row => Number.isFinite(row.tool_failed));
  const stats = [
    ['已记录', selected.length + ' 题'],
    ['正常完成', eligible ? completed + ' / ' + eligible : '—'],
    ['报错未完成', selected.length ? count('error') + ' 题' : '—'],
    ['超时未完成', selected.length ? count('timeout') + ' 题' : '—'],
    ['失败工具调用', tools.length ? tools.reduce((sum, row) => sum + row.tool_failed, 0) + ' 次' : '—'],
    ['已评分', completed ? scored.length + ' / ' + completed : '—'],
    ['低于 50 分', scored.length ? scored.filter(row => row.quality_score < 50).length + ' / ' + scored.length : '—'],
  ];
  if (scope.value === 'all' && Number.isInteger(currentRun.report_error_cases)) {
    stats.push(['报错记录涉及（含评分）', currentRun.report_error_cases + ' 题']);
  }
  document.getElementById('run-overview-stats').replaceChildren(...stats.map(([label, value]) => {
    const item = element('div');
    item.append(element('dt', label), element('dd', value));
    return item;
  }));
}

function render() {
  const overview = jobOrAll();
  const rows = visibleRows();
  const series = new Map();
  const shownCases = new Set();
  let completed = 0, scored = 0;
  for (const row of rows) {
    shownCases.add(row.case_id);
    const key = row.case_id + ' / ' + version(row);
    if (!series.has(key)) series.set(key, []);
    series.get(key).push(row);
    if (row.qa_outcome === 'completed') completed++;
    if (row.quality_score !== null) scored++;
  }
  document.getElementById('coverage').textContent = shownCases.size + ' 个 Case，' + rows.length +
    ' 次记录，正常交付 ' + completed + ' 次，已评分 ' + scored + ' 次。';
  showLegend(shownCases, overview);
  document.getElementById('rates').hidden = !overview;
  if (overview) drawRates(rows);
  metricHost.classList.toggle('overview', overview);
  metricHost.classList.toggle('trends', !overview);
  for (const view of metricViews) {
    const {metric, thresholdPane, caption} = view;
    thresholdPane.hidden = !overview;
    caption.hidden = !overview;
    if (overview) drawThresholds(view, rows);
    draw(metric.id, series, metric.value, metric.maximum, metric.color ?? '#356df3',
      {byCase: overview, percent: metric.unit === '%'});
  }
  showRunOverview(rows);
  showDetails(rows);
}

scope.onchange = selectScope;
revision.onchange = render;
if (pagesEnvironment) {
  const nav = document.getElementById('environments');
  nav.hidden = false;
  for (const link of nav.querySelectorAll('a')) {
    if (link.textContent === pagesEnvironment) link.setAttribute('aria-current', 'page');
  }
  if (!currentRun) {
    document.title += ' · ' + pagesEnvironment;
    document.querySelector('h1').textContent = document.title;
    document.getElementById('description').textContent = '等待该环境首次发布 Journey-3 报告。';
    document.getElementById('dashboard').hidden = true;
  }
}
if (currentRun) {
  const label = runLabel(currentRun.run_id, currentRun.attempt);
  document.getElementById('run-overview').hidden = publicRunDetails;
  document.getElementById('run-overview-title').textContent = '最近一次运行概况 · ' + label;
  document.getElementById('details').hidden = Boolean(currentRun.metrics_only) && !publicRunDetails;
  document.getElementById('details-title').textContent = '最近一次运行明细 · ' + label;
  document.getElementById('public-detail-caption').hidden = !publicRunDetails;
  if (currentRun.environment) {
    document.title += ' · ' + currentRun.environment;
    document.querySelector('h1').textContent = document.title;
  }
  document.getElementById('description').textContent = runLabel(currentRun.run_id, currentRun.attempt);
  if (currentRun.coverage) {
    const {recorded, planned, missing} = currentRun.coverage;
    const coverage = document.getElementById('report-coverage');
    coverage.textContent = '本次记录 ' + recorded + ' / ' + planned + ' 题' +
      (missing.length ? ' · 缺少 ' + missing.join('、') : '');
    coverage.hidden = false;
  }
}
selectScope();
</script>
</body>
</html>
