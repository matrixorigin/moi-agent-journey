name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  judge-image:
    uses: ./.github/workflows/build-judge.yml
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-functional.txt
      - run: python3 -m unittest discover -s tests -v
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  batch-artifact-smoke:
    name: batch-artifact-smoke (${{ matrix.workspace }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: journey-2
            cases: [J2-02, J2-06]
          - workspace: journey-3
            cases: [J3-01, J3-02]
    env:
      JOURNEY_WORKSPACE: ${{ matrix.workspace }}
      JOURNEY_CASES: ${{ toJSON(matrix.cases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-functional.txt
      # Without QA credentials both cases must record configuration errors.
      # The second must still run and both reports must survive a grouped upload.
      - name: Exercise failure reporting without QA
        id: batch
        continue-on-error: true
        run: >-
          python3 -m journey.batch --workspace "$JOURNEY_WORKSPACE" --cases "$JOURNEY_CASES"
          --work batch-work --out published-results
      - name: Verify both cases ran despite the first failure
        env:
          BATCH_OUTCOME: ${{ steps.batch.outcome }}
        run: |
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          assert os.environ['BATCH_OUTCOME'] == 'failure'
          rows = json.loads(Path('batch-work/batch-result.json').read_text())['cases']
          assert [row['case_id'] for row in rows] == json.loads(os.environ['JOURNEY_CASES'])
          assert all(row['failed_stages'] == ['execute', 'report'] for row in rows), rows
          PYVERIFY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: case-${{ matrix.workspace }}-group-smoke-attempt-${{ github.run_attempt }}
          path: published-results/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: case-${{ matrix.workspace }}-group-smoke-attempt-${{ github.run_attempt }}
          path: smoke-results
      - name: Verify independent case reports survived grouped upload and download
        run: |
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          for case_id in json.loads(os.environ['JOURNEY_CASES']):
              root = Path('smoke-results') / case_id
              result = json.loads((root / 'result.json').read_text())
              assert result['test_status'] == 'error'
              assert result['harness_errors'][0]['stage'] == 'configuration'
              assert (root / 'case-summary.md').is_file()
              if os.environ['JOURNEY_WORKSPACE'] == 'journey-3':
                  assert result['rag']['expected_answers'] == 1
              assert json.loads((root / 'publication.json').read_text())['status'] == 'complete'
          PYVERIFY
  judge-test:
    needs: judge-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Load isolated validator
        uses: ./.github/actions/load-judge
        with:
          artifact-name: judge-image-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Exercise Office validators with editable fixtures
        run: >-
          docker run --rm --init --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges --memory=3g --cpus=2 --pids-limit=256
          --tmpfs /tmp:rw,size=1g,mode=1777
          --mount "type=bind,src=${GITHUB_WORKSPACE}/tests_judge,dst=/tests_judge,readonly"
          --entrypoint python moi-journey-judge
          -m unittest discover -s /tests_judge -v
