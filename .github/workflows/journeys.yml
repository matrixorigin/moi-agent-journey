name: Agent journeys
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: '测试环境（Production 仅支持 journey-3）'
        type: choice
        options: [qa, production]
        default: qa
      workspace:
        description: '工作区（all 表示运行全部）'
        type: choice
        options:
          - all
          - journey-1 (Complex Long-Horizon Tasks)
          - journey-2 (Basic Functional End-to-End Tasks)
          - journey-3 (Knowledge Base Tasks)
          - journey-4
          - journey-5 (Feishu Bidirectional End-to-End Tasks)
        default: all
permissions:
  contents: read
concurrency:
  group: agent-journeys-${{ inputs.target_environment || 'qa' }}
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      case-bundle: ${{ steps.plan.outputs.case-bundle }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace || 'all' }}
          MOI_ENVIRONMENT: ${{ inputs.target_environment || 'qa' }}
        run: python3 -m journey.catalog plan-workspaces "$JOURNEY_WORKSPACE"
  judge-image:
    needs: plan
    if: needs.plan.outputs.case-bundle == 'true'
    uses: ./.github/workflows/build-judge.yml
  journeys:
    name: ${{ matrix.display_name }}
    needs: [plan, judge-image]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          (needs.judge-image.result == 'success' || needs.plan.outputs.case-bundle == 'false') }}
    # Reusable jobs narrow this ceiling: only Journey-5's credential-renewal job writes.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/run-journey.yml
    with:
      workspace: ${{ matrix.workspace }}
      target_environment: ${{ inputs.target_environment || 'qa' }}
      judge_image_artifact: judge-image-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    secrets: inherit
  report:
    needs: [plan, journeys]
    # Finalize already-recorded results even after an ordinary cancellation.
    if: always() && needs.plan.result == 'success'
    environment: ${{ inputs.target_environment || 'qa' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages-snapshot: ${{ steps.j3-pages.outputs.artifact-id != '' && format('journey-3-pages-metrics-attempt-{0}', github.run_attempt) || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: always()
        with:
          persist-credentials: false
      - name: Download all case evidence
        if: always() && needs.plan.outputs.case-bundle == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: case-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: downloaded-results
      - name: Save complete Journey-3 report to the target Catalog
        id: j3-report
        if: ${{ always() && contains(fromJSON(needs.plan.outputs.matrix).include.*.workspace, 'journey-3') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_PAGES: ${{ github.ref == 'refs/heads/main' && github.repository == 'matrixorigin/moi-agent-journey' }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ (inputs.target_environment != 'production' || vars.MOI_J3_AUTH_MODE == 'pat') && secrets.MOI_PAT || '' }}
          MOI_ENVIRONMENT: ${{ inputs.target_environment || 'qa' }}
          MOI_J3_WORKSPACE_ID: ${{ vars.MOI_J3_WORKSPACE_ID }}
          MOI_J3_AUTH_MODE: ${{ vars.MOI_J3_AUTH_MODE }}
          MOI_J3_CLIENT_ID: ${{ inputs.target_environment == 'production' && vars.MOI_J3_AUTH_MODE != 'pat' && secrets.MOI_J3_CLIENT_ID || '' }}
          MOI_J3_CLIENT_SECRET: ${{ inputs.target_environment == 'production' && vars.MOI_J3_AUTH_MODE != 'pat' && secrets.MOI_J3_CLIENT_SECRET || '' }}
        run: |
          pages=()
          if [[ "$PUBLISH_PAGES" == true ]]; then
            pages=(--pages-snapshot "$RUNNER_TEMP/journey-3-pages/snapshot.json")
          fi
          python3 -m journey.benchmark_run_report --artifact-dir "$RUNNER_TEMP/journey-3-html" "${pages[@]}"
      - name: Stage Journey-3 metrics for GitHub Pages
        id: j3-pages
        if: ${{ !cancelled() && steps.j3-report.outputs.pages-snapshot != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-3-pages-metrics-attempt-${{ github.run_attempt }}
          path: ${{ steps.j3-report.outputs.pages-snapshot }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload Journey-3 HTML
        id: j3-html
        if: ${{ always() && steps.j3-report.outputs.artifact-file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.j3-report.outputs.artifact-file }}
          archive: false
          if-no-files-found: error
          retention-days: 1
      - name: Link Journey-3 HTML
        if: ${{ always() && steps.j3-html.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.j3-html.outputs.artifact-url }}
        run: printf '\n[下载 Journey-3 HTML 报告](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Account for cases with GitHub evidence bundles
        if: always() && needs.plan.outputs.case-bundle == 'true'
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace || 'all' }}
        run: python3 -m journey.report aggregate --workspace "$JOURNEY_WORKSPACE" --exclude-journey-3
      - name: Upload consolidated results
        id: upload-report
        if: always() && needs.plan.outputs.case-bundle == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
      - name: Link consolidated report
        if: always() && steps.upload-report.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        run: printf '\n[下载报告](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
  publish-journey-3-pages:
    needs: report
    if: ${{ !cancelled() && needs.report.outputs.pages-snapshot != '' }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/journey-3-pages.yml
    with:
      snapshot: ${{ needs.report.outputs.pages-snapshot }}
      target_environment: ${{ inputs.target_environment || 'qa' }}
