name: Agent journeys QA
on:
  workflow_dispatch:
    inputs:
      workspace:
        description: '工作区（all 表示运行全部）'
        type: choice
        options:
          - all
          - journey-1 (Complex Long-Horizon Tasks)
          - journey-2 (Basic Functional End-to-End Tasks)
          - journey-3
          - journey-4
          - journey-5
        default: all
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: agent-journeys-qa
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace || 'all' }}
        run: python3 -m journey.catalog plan-workspaces "$JOURNEY_WORKSPACE"
  judge-image:
    uses: ./.github/workflows/build-judge.yml
  journeys:
    name: ${{ matrix.display_name }}
    needs: [plan, judge-image]
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/run-journey.yml
    with:
      workspace: ${{ matrix.workspace }}
      judge_image_artifact: judge-image-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    secrets: inherit
  report:
    needs: journeys
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download all case evidence
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: case-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
          path: downloaded-results
      - name: Account for every configured case
        if: always()
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace || 'all' }}
        run: python3 -m journey.report aggregate --workspace "$JOURNEY_WORKSPACE"
      - name: Upload consolidated results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journey-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
