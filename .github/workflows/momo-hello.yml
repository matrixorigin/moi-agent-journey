name: Momo hello QA
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: momo-hello-qa
  cancel-in-progress: false
jobs:
  hello:
    # Fork PRs must never execute with QA credentials. No pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: qa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify runner before accessing QA
        run: python3 -m unittest discover -s tests -v
      - name: Run Momo hello
        env:
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_WORKSPACE: journey-1
          MOI_MODEL: deepseek-v4.1-flash
        run: python3 -m journey.hello
