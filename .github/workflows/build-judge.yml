name: Build isolated validator
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build isolated validator
        timeout-minutes: 20
        run: >-
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA"
          -t moi-journey-judge -f judge/Dockerfile .
      - name: Package image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/journey-judge"
          docker image save --output "$RUNNER_TEMP/journey-judge/image.tar" moi-journey-judge
          cd "$RUNNER_TEMP/journey-judge"
          sha256sum image.tar > image.tar.sha256
      - name: Upload image for this attempt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: judge-image-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/journey-judge/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
