name: Journey-3 Pages
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/journey-3-pages.yml
      - datasets/journey-3/history.html
      - datasets/journey-3/pages-index.html
      - journey/benchmark_history.py
      - journey/benchmark_pages.py
  workflow_call:
    inputs:
      snapshot:
        type: string
        required: true
      target_environment:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'matrixorigin/moi-agent-journey' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: journey-3-pages
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out published metrics snapshots
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: journey-3-pages-data
          path: pages-state
      - name: Download this run's public metrics
        if: inputs.snapshot != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.snapshot }}
          path: incoming-pages-metrics
      - name: Render QA and Production pages
        env:
          SNAPSHOT_ARTIFACT: ${{ inputs.snapshot }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          snapshot=()
          if [[ -n "$SNAPSHOT_ARTIFACT" ]]; then
            snapshot=(--incoming incoming-pages-metrics/snapshot.json --environment "$TARGET_ENVIRONMENT")
          fi
          python3 -m journey.benchmark_pages --state pages-state --out "$RUNNER_TEMP/pages" "${snapshot[@]}"
      - name: Save the updated metrics snapshot
        run: |
          git -C pages-state add --all
          if ! git -C pages-state diff --cached --quiet; then
            git -C pages-state -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update Journey-3 Pages metrics'
            git -C pages-state push origin HEAD:refs/heads/journey-3-pages-data
          fi
      - name: Prepare the Pages artifact client
        # Match the artifact library bundled into deploy-pages v5.0.1.
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-artifact-client" \
            --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @actions/artifact@2.1.8
      - name: Upload GitHub Pages site
        id: site-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages
      - name: Wait for this attempt's Pages artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        timeout-minutes: 1
        env:
          PAGES_ARTIFACT_ID: ${{ steps.site-artifact.outputs.artifact_id }}
          PAGES_ARTIFACT_NAME: github-pages-attempt-${{ github.run_attempt }}
        with:
          script: |
            const { join } = require('node:path')
            const { setTimeout: sleep } = require('node:timers/promises')
            const { DefaultArtifactClient } = require(join(process.env.RUNNER_TEMP,
              'pages-artifact-client/node_modules/@actions/artifact'))
            const expectedId = process.env.PAGES_ARTIFACT_ID
            const expectedName = process.env.PAGES_ARTIFACT_NAME
            if (!expectedId || !expectedName) throw new Error('Pages upload returned no artifact identity.')

            // List artifacts the same way deploy-pages does, within this workflow run.
            const client = new DefaultArtifactClient()
            const deadline = Date.now() + 60_000
            while (Date.now() < deadline) {
              const nextCheck = Date.now() + 5_000
              try {
                const { artifacts } = await client.listArtifacts()
                if (Date.now() < deadline &&
                    artifacts.some(artifact => String(artifact.id) === expectedId && artifact.name === expectedName)) {
                  core.info('The uploaded Pages artifact is visible to deploy-pages.')
                  return
                }
              } catch {
                core.debug('The artifact listing request failed. Checking again within the deadline.')
              }
              const delay = Math.min(nextCheck, deadline) - Date.now()
              if (delay > 0) await sleep(delay)
            }
            core.setFailed('The uploaded Pages artifact did not become visible to deploy-pages within 60 seconds.')
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}
      - name: Link the dashboards
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '\nJourney-3 GitHub Pages · [QA](%s/qa/) · [Production](%s/production/)\n' \
            "${PAGE_URL%/}" "${PAGE_URL%/}" >> "$GITHUB_STEP_SUMMARY"
