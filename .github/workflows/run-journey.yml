name: Run one journey
on:
  workflow_call:
    inputs:
      workspace:
        required: true
        type: string
      judge_image_artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      concurrency: ${{ steps.plan.outputs.concurrency }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace }}
        run: python3 -m journey.catalog plan "$JOURNEY_WORKSPACE"
  feishu-auth:
    name: Renew Feishu CI grant
    needs: plan
    if: inputs.workspace == 'journey-5'
    environment: qa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m pip install -r requirements-feishu.txt
      - name: Claim, refresh once, and persist encrypted successor
        env:
          GH_TOKEN: ${{ github.token }}
          MOI_J5_FEISHU_TARGET: ${{ vars.MOI_J5_FEISHU_TARGET }}
          MOI_J5_FEISHU_APP_SECRET: ${{ secrets.MOI_J5_FEISHU_APP_SECRET }}
          MOI_J5_FEISHU_STATE_KEY: ${{ secrets.MOI_J5_FEISHU_STATE_KEY }}
        run: python3 -m journey.feishu_auth rotate
  cases:
    name: cases (${{ matrix.case }})
    needs: [plan, feishu-auth]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    environment: qa
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.concurrency) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Empty journey
        if: matrix.case == 'EMPTY'
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace }}
        run: echo "$JOURNEY_WORKSPACE has no cases; excluded from success-rate denominator."
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.case != 'EMPTY'
        with:
          python-version: '3.12'
      - name: Prepare checksum-verified inputs and oracles
        if: matrix.case != 'EMPTY' && matrix.executor != 'batch'
        timeout-minutes: 15
        env:
          CASE_ID: ${{ matrix.case }}
        run: python3 -m journey.catalog prepare "$CASE_ID"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.executor == 'browser' || matrix.needs_browser == true
        with:
          node-version: '22'
      - name: Install browser test dependencies
        if: matrix.executor == 'browser' || matrix.needs_browser == true
        run: npm ci --ignore-scripts
      - name: Install Chromium
        if: matrix.executor == 'browser' || matrix.needs_browser == true
        run: npx playwright install --with-deps chromium
      - name: Run QA task and capture events
        if: matrix.executor == 'office'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
        run: python3 -m journey.run_case "$CASE_ID"
      - name: Run bound-agent knowledge Q&A and evaluate answers and trajectory
        if: matrix.executor == 'knowledge'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
        run: python3 -m journey.knowledge_case "$CASE_ID"
      - name: Install evidence validators
        if: matrix.executor == 'api' || matrix.executor == 'batch'
        run: python3 -m pip install -r requirements-functional.txt
      - name: Read this run's Feishu member grant
        if: matrix.needs_feishu == true
        env:
          GH_TOKEN: ${{ github.token }}
          MOI_J5_FEISHU_TARGET: ${{ vars.MOI_J5_FEISHU_TARGET }}
          MOI_J5_FEISHU_STATE_KEY: ${{ secrets.MOI_J5_FEISHU_STATE_KEY }}
          FEISHU_RENEWAL_RESULT: ${{ needs.feishu-auth.result }}
        run: |
          if [ "$FEISHU_RENEWAL_RESULT" != success ]; then
            echo '::error::Feishu credential renewal failed; this run cannot use an earlier grant.'
            exit 1
          fi
          python3 -m journey.feishu_auth access
      - name: Run functional conversation and capture QA events
        if: matrix.executor == 'api'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_J2_NATIVE_SKILL_SOURCE_FILE_ID: ${{ vars.MOI_J2_NATIVE_SKILL_SOURCE_FILE_ID }}
          MOI_J2_CHANNEL_TARGETS: ${{ vars.MOI_J2_CHANNEL_TARGETS }}
          MOI_J2_SLACK_READ_TOKEN: ${{ secrets.MOI_J2_SLACK_READ_TOKEN }}
          MOI_J2_FEISHU_APP_ID: ${{ secrets.MOI_J2_FEISHU_APP_ID }}
          MOI_J2_FEISHU_APP_SECRET: ${{ secrets.MOI_J2_FEISHU_APP_SECRET }}
        run: python3 -m journey.functional_case "$CASE_ID"
      - name: Run browser case and capture QA events
        if: matrix.executor == 'browser'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_UI_ACCOUNT: ${{ secrets.MOI_UI_ACCOUNT }}
          MOI_UI_PASSWORD: ${{ secrets.MOI_UI_PASSWORD }}
          MOI_UI_BASE_URL: ${{ secrets.MOI_UI_BASE_URL }}
          MOI_UI_AUTH_ORIGIN: ${{ secrets.MOI_UI_AUTH_ORIGIN }}
        run: python3 -m journey.browser_case "$CASE_ID"
      - name: Run sequential cases with independent reports
        if: matrix.executor == 'batch' && (success() || (matrix.needs_feishu == true && !cancelled()))
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace }}
          JOURNEY_CASES: ${{ toJSON(matrix.case_ids) }}
          MOI_J5_FEISHU_TARGET: ${{ matrix.needs_feishu && vars.MOI_J5_FEISHU_TARGET || '' }}
          MOI_J5_FEISHU_APP_SECRET: ${{ matrix.needs_feishu && secrets.MOI_J5_FEISHU_APP_SECRET || '' }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_J2_NATIVE_SKILL_SOURCE_FILE_ID: ${{ inputs.workspace == 'journey-2' && vars.MOI_J2_NATIVE_SKILL_SOURCE_FILE_ID || '' }}
          MOI_J2_CHANNEL_TARGETS: ${{ inputs.workspace == 'journey-2' && vars.MOI_J2_CHANNEL_TARGETS || '' }}
          MOI_J2_SLACK_READ_TOKEN: ${{ inputs.workspace == 'journey-2' && secrets.MOI_J2_SLACK_READ_TOKEN || '' }}
          MOI_J2_FEISHU_APP_ID: ${{ inputs.workspace == 'journey-2' && secrets.MOI_J2_FEISHU_APP_ID || '' }}
          MOI_J2_FEISHU_APP_SECRET: ${{ inputs.workspace == 'journey-2' && secrets.MOI_J2_FEISHU_APP_SECRET || '' }}
          MOI_UI_ACCOUNT: ${{ matrix.needs_browser && secrets.MOI_UI_ACCOUNT || '' }}
          MOI_UI_PASSWORD: ${{ matrix.needs_browser && secrets.MOI_UI_PASSWORD || '' }}
          MOI_UI_BASE_URL: ${{ matrix.needs_browser && secrets.MOI_UI_BASE_URL || '' }}
          MOI_UI_AUTH_ORIGIN: ${{ matrix.needs_browser && secrets.MOI_UI_AUTH_ORIGIN || '' }}
        run: >-
          python3 -m journey.batch --workspace "$JOURNEY_WORKSPACE" --cases "$JOURNEY_CASES"
          --work batch-work --out published-results
      - name: Load isolated validator
        if: matrix.executor == 'office'
        uses: ./.github/actions/load-judge
        with:
          artifact-name: ${{ inputs.judge_image_artifact }}
      - name: Validate actual delivered files
        if: matrix.executor == 'office' && !cancelled() && success()
        timeout-minutes: 32
        env:
          CASE_ID: ${{ matrix.case }}
        run: python3 -m journey.validate "$CASE_ID"
      - name: Case result and failure details
        if: always() && matrix.case != 'EMPTY' && matrix.executor != 'batch'
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_J2_SLACK_READ_TOKEN: ${{ secrets.MOI_J2_SLACK_READ_TOKEN }}
          MOI_J2_FEISHU_APP_ID: ${{ secrets.MOI_J2_FEISHU_APP_ID }}
          MOI_J2_FEISHU_APP_SECRET: ${{ secrets.MOI_J2_FEISHU_APP_SECRET }}
          MOI_UI_ACCOUNT: ${{ matrix.executor == 'browser' && secrets.MOI_UI_ACCOUNT || '' }}
          MOI_UI_PASSWORD: ${{ matrix.executor == 'browser' && secrets.MOI_UI_PASSWORD || '' }}
          MOI_UI_BASE_URL: ${{ matrix.executor == 'browser' && secrets.MOI_UI_BASE_URL || '' }}
          MOI_UI_AUTH_ORIGIN: ${{ matrix.executor == 'browser' && secrets.MOI_UI_AUTH_ORIGIN || '' }}
        run: python3 -m journey.report case "$CASE_ID"
      - name: Prepare safe public evidence and isolate uninspectable files
        id: scan
        if: always() && matrix.case != 'EMPTY' && matrix.executor != 'batch'
        env:
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_J2_SLACK_READ_TOKEN: ${{ secrets.MOI_J2_SLACK_READ_TOKEN }}
          MOI_J2_FEISHU_APP_ID: ${{ secrets.MOI_J2_FEISHU_APP_ID }}
          MOI_J2_FEISHU_APP_SECRET: ${{ secrets.MOI_J2_FEISHU_APP_SECRET }}
          MOI_UI_ACCOUNT: ${{ matrix.executor == 'browser' && secrets.MOI_UI_ACCOUNT || '' }}
          MOI_UI_PASSWORD: ${{ matrix.executor == 'browser' && secrets.MOI_UI_PASSWORD || '' }}
          MOI_UI_BASE_URL: ${{ matrix.executor == 'browser' && secrets.MOI_UI_BASE_URL || '' }}
          MOI_UI_AUTH_ORIGIN: ${{ matrix.executor == 'browser' && secrets.MOI_UI_AUTH_ORIGIN || '' }}
        run: python3 -m journey.publish
      - name: Upload case or group evidence even on failure
        id: evidence-upload
        if: always() && (matrix.executor == 'batch' || (matrix.case != 'EMPTY' && steps.scan.outcome == 'success'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: case-${{ matrix.executor == 'batch' && format('{0}-{1}', inputs.workspace, matrix.case) || matrix.case }}-attempt-${{ github.run_attempt }}
          path: published-results/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
      - name: Group evidence download
        if: always() && matrix.executor == 'batch' && steps.evidence-upload.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.evidence-upload.outputs.artifact-url }}
        run: echo "[Download this group's case reports and evidence]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
