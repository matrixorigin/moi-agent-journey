name: Run one journey
on:
  workflow_call:
    inputs:
      workspace:
        required: true
        type: string
      judge_image_artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      concurrency: ${{ steps.plan.outputs.concurrency }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: plan
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace }}
        run: python3 -m journey.catalog plan "$JOURNEY_WORKSPACE"
  cases:
    needs: plan
    environment: qa
    runs-on: ubuntu-latest
    timeout-minutes: 135
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.concurrency) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Empty journey
        if: matrix.case == 'EMPTY'
        env:
          JOURNEY_WORKSPACE: ${{ inputs.workspace }}
        run: echo "$JOURNEY_WORKSPACE has no cases; excluded from success-rate denominator."
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: matrix.case != 'EMPTY'
        with:
          python-version: '3.12'
      - name: Prepare checksum-verified inputs and oracles
        if: matrix.case != 'EMPTY'
        timeout-minutes: 15
        env:
          CASE_ID: ${{ matrix.case }}
        run: python3 -m journey.catalog prepare "$CASE_ID"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.executor == 'browser'
        with:
          node-version: '22'
      - name: Install browser test dependencies
        if: matrix.executor == 'browser'
        run: npm ci --ignore-scripts
      - name: Install Chromium
        if: matrix.executor == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Run QA task and capture events
        if: matrix.executor == 'office'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
        run: python3 -m journey.run_case "$CASE_ID"
      - name: Run functional conversation and capture QA events
        if: matrix.executor == 'api'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
        run: python3 -m journey.functional_case "$CASE_ID"
      - name: Run browser case and capture QA events
        if: matrix.executor == 'browser'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_UI_ACCOUNT: ${{ secrets.MOI_UI_ACCOUNT }}
          MOI_UI_PASSWORD: ${{ secrets.MOI_UI_PASSWORD }}
          MOI_UI_BASE_URL: ${{ secrets.MOI_UI_BASE_URL }}
          MOI_UI_AUTH_ORIGIN: ${{ secrets.MOI_UI_AUTH_ORIGIN }}
        run: python3 -m journey.browser_case "$CASE_ID"
      - name: Load isolated validator
        if: matrix.executor == 'office'
        uses: ./.github/actions/load-judge
        with:
          artifact-name: ${{ inputs.judge_image_artifact }}
      - name: Validate actual delivered files
        if: matrix.executor == 'office' && !cancelled() && success()
        timeout-minutes: 32
        env:
          CASE_ID: ${{ matrix.case }}
        run: python3 -m journey.validate "$CASE_ID"
      - name: Case result and failure details
        if: always() && matrix.case != 'EMPTY'
        env:
          CASE_ID: ${{ matrix.case }}
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_UI_ACCOUNT: ${{ matrix.executor == 'browser' && secrets.MOI_UI_ACCOUNT || '' }}
          MOI_UI_PASSWORD: ${{ matrix.executor == 'browser' && secrets.MOI_UI_PASSWORD || '' }}
          MOI_UI_BASE_URL: ${{ matrix.executor == 'browser' && secrets.MOI_UI_BASE_URL || '' }}
          MOI_UI_AUTH_ORIGIN: ${{ matrix.executor == 'browser' && secrets.MOI_UI_AUTH_ORIGIN || '' }}
        run: python3 -m journey.report case "$CASE_ID"
      - name: Prepare safe public evidence and isolate uninspectable files
        id: scan
        if: always() && matrix.case != 'EMPTY'
        env:
          MOI_BASE_URL: ${{ secrets.MOI_BASE_URL }}
          MOI_PAT: ${{ secrets.MOI_PAT }}
          MOI_UI_ACCOUNT: ${{ matrix.executor == 'browser' && secrets.MOI_UI_ACCOUNT || '' }}
          MOI_UI_PASSWORD: ${{ matrix.executor == 'browser' && secrets.MOI_UI_PASSWORD || '' }}
          MOI_UI_BASE_URL: ${{ matrix.executor == 'browser' && secrets.MOI_UI_BASE_URL || '' }}
          MOI_UI_AUTH_ORIGIN: ${{ matrix.executor == 'browser' && secrets.MOI_UI_AUTH_ORIGIN || '' }}
        run: python3 -m journey.publish
      - name: Upload case evidence even on failure
        if: always() && matrix.case != 'EMPTY' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: case-${{ matrix.case }}-attempt-${{ github.run_attempt }}
          path: published-results/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
